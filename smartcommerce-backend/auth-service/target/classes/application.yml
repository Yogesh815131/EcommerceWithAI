server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://ep-late-base-az4ls7i9-pooler.c-3.ap-southeast-1.aws.neon.tech/authservicedb?sslmode=require&channelBinding=require
    username: neondb_owner
    password: npg_WbFiBN4Q2hJK
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-prod-min-256-bits}
  expiration-ms: 3600000       # access token: 1 hour
  refresh-expiration-days: 30  # refresh token: 30 days

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

