server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: user-service-vendors
          uri: lb://user-service
          predicates:
            - Path=/api/vendors/**

        - id: user-service-addresses
          uri: lb://user-service
          predicates:
            - Path=/api/addresses/**
        # TODO: add routes as each service is built, e.g.
        # - id: user-service
        #   uri: lb://user-service
        #   predicates:
        #     - Path=/api/users/**
        #
        # - id: product-service
        #   uri: lb://product-service
        #   predicates:
        #     - Path=/api/products/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-prod-min-256-bits}